name: Terraform Infra

on:
  pull_request:
    paths: ["infra/**"]
  push:
    branches: [main]
    paths: ["infra/**"]
  # Bổ sung trigger thủ công từ giao diện GitHub Actions
  workflow_dispatch:
    inputs:
      action:
        description: 'Thao tác thực thi (apply hoặc destroy)'
        required: true
        default: 'apply'
        type: choice
        options:
          - apply
          - destroy

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  TF_WORKING_DIR: infra

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Terraform init
        run: terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: Terraform validate
        run: terraform validate
        working-directory: ${{ env.TF_WORKING_DIR }}

      # -------------------------------------------------------------
      # 1. TRƯỜNG HỢP DESTROY THỦ CÔNG (Chạy khi chọn destroy trên UI)
      # -------------------------------------------------------------
      - name: Terraform destroy
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'destroy'
        run: terraform destroy -auto-approve
        working-directory: ${{ env.TF_WORKING_DIR }}

      # -------------------------------------------------------------
      # 2. BƯỚC PLAN VÀ COMMENT (Chỉ chạy khi KHÔNG PHẢI thao tác destroy)
      # -------------------------------------------------------------
      - name: Terraform plan
        if: github.event_name != 'workflow_dispatch' || inputs.action != 'destroy'
        id: plan
        run: terraform plan -no-color -out=tfplan
        working-directory: ${{ env.TF_WORKING_DIR }}
        continue-on-error: true

      - name: Comment plan vào PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          PLAN: "${{ steps.plan.outputs.stdout }}"
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `#### Terraform Plan\n\`\`\`\n${process.env.PLAN}\n\`\`\``
            });

      - name: Fail nếu plan lỗi
        if: (github.event_name != 'workflow_dispatch' || inputs.action != 'destroy') && steps.plan.outcome == 'failure'
        run: exit 1

      # -------------------------------------------------------------
      # 3. TRƯỜNG HỢP APPLY (Chạy khi Merge vào main HOẶC chọn apply thủ công)
      # -------------------------------------------------------------
      - name: Terraform apply
        if: |
          (github.ref == 'refs/heads/main' && github.event_name == 'push') ||
          (github.event_name == 'workflow_dispatch' && inputs.action == 'apply')
        run: terraform apply -auto-approve tfplan
        working-directory: ${{ env.TF_WORKING_DIR }}